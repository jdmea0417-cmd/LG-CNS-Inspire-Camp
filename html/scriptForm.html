<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
    <div class="mb-3 mt-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
    </div>
    <div class="mb-3">
        <label for="pwd" class="form-label">Password:</label>
        <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
    </div>
    <div class="form-check mb-3">
        <label class="form-check-label">
            <input class="form-check-input" type="checkbox" name="remember"> Remember me
        </label>
    </div>
    <button type="button" class="btn btn-primary" id = "btn">Submit</button>

    <script>
        // 통신ㅇ르 통해서 서버로부터 내려받은 데이터의 포맷이 객체형태인 경우
        const user = {
            email : 'qwer',
            password : '1234'
        }
        // 해당 데이터를 페이지 로드시 document에 렌더링 시키는 구조
        document.querySelector('#email').value = user.email;
        document.querySelector('#pwd').value = user.password;


        let btn =document.querySelector('#btn');
        btn.onclick = () => {
            let email = document.querySelector('#email').value;
            let password = document.querySelector('#pwd').value;
            const data = {
                email, 
                password
            }
            console.log(`debug >>>> send data : ${data}`);
            console.log(`debug >>>> send data : ${data.email}`);
            console.log(`debug >>>> send data : ${data.password}`);
        };
    </script>
</body>

</html>
