    <body>
        <form action="./text.html" method="get">
            <fieldset>
                <legend>배송 예약 정보 입력</legend>
                <!-- 순서가 상관없는 리스트 -->
                <ul>
                    <li>
                        <label>주문상품</label>
                        <input type="text" 
                        id="prd-name" 
                        name="prd-name"
                        placeholder="상품이름을 입력하세요">
                    </li>
                    <li>
                        <label>주문자명</label>
                        <input type="text" 
                        name="cust-name">

                    <li>
                        <label>배송지</label>
                        <input type="text" 
                        name="address">
                    </li>
                    <li>
                        <label>연락처</label>
                        <input type="text" 
                        name="tel">
                    </li>
                    <li>
                        <label>배송일 지정</label>
                        <input type="date" 
                        name="date">
                    </li>
                </ul>
                <div align="center">
                    <button type="submit">예약</button>
                    <button type="reset">취소</button>
                </div>
            </fieldset>
